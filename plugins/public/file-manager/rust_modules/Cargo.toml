[package]
name = "document_processing_rs"
version = "0.1.0"
edition = "2021"
description = "High-performance document processing for OctaviOS File Manager"
authors = ["Saptiva Team <dev@saptiva.com>"]
license = "MIT"

[lib]
name = "document_processing_rs"
crate-type = ["cdylib"]

[features]
default = []
# OCR requires system libraries: libleptonica-dev, libtesseract-dev
ocr = ["leptess"]

[dependencies]
# PyO3 for Python bindings
# RUSTSEC-2025-0020: Fixed buffer overflow in PyString::from_object
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }

# PDF processing - pdf-extract for text extraction (pure Rust)
pdf-extract = "0.7"
lopdf = "0.33"

# OCR - leptess for Tesseract bindings (optional, requires system libs)
leptess = { version = "0.14", optional = true }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Parallel processing
rayon = "1.10"

# Text processing and validation
regex = "1.11"
unicode-segmentation = "1.12"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization (for complex data structures)
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
