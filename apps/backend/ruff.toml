# Ruff configuration for OctaviOS Backend
# https://docs.astral.sh/ruff/configuration/

# Exclude draft/WIP and auto-generated files (applies to both lint and format)
exclude = [
    "src/routers/chat_new_endpoint.py",  # WIP draft file
    "src/proto_stubs/generated/*",       # Auto-generated by protoc/grpc_tools
]

[lint]
# Enable pyflakes (F), pycodestyle errors (E), isort (I)
select = ["F", "E", "W", "I"]

# Ignore specific rules
ignore = [
    "E402",  # Module level import not at top (needed for sys.path manipulation)
    "E501",  # Line too long (handled by formatter)
    "E701",  # Multiple statements on one line
    "E722",  # Bare except (legacy code, will fix gradually)
    "W291",  # Trailing whitespace (in markdown strings)
    "W293",  # Blank line contains whitespace (in docstrings)
    "F841",  # Unused variable (some are intentional for debugging)
]

[lint.per-file-ignores]
# MCP module has complex import patterns
"src/mcp/*" = ["F401", "F841"]

[format]
# Use double quotes for strings
quote-style = "double"
# Indent with 4 spaces
indent-style = "space"
