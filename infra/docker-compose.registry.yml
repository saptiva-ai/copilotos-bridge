# ============================================================================
# DOCKER COMPOSE - REGISTRY OVERRIDE
# ============================================================================
# Este archivo override usa imagenes pre-construidas desde Docker Hub
# en lugar de construir localmente.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml -f docker-compose.registry.yml up -d
#
# IMPORTANTE: Antes de cambiar versiones, verificar que existen en Docker Hub:
#   docker manifest inspect ${DOCKER_REGISTRY_USER:-your_registry_user}/octavios-<service>:<version>
#
# ============================================================================

services:
  backend:
    image: saptivaai/octavios-backend:${BACKEND_VERSION:-1.3.0}
    build: null  # Desactiva el build

  web:
    image: saptivaai/octavios-web:${WEB_VERSION:-1.3.0}
    build: null  # Desactiva el build

  file-manager:
    image: saptivaai/octavios-file-manager:${FILE_MANAGER_VERSION:-1.3.0}
    build: null  # Desactiva el build
