services:
  web:
    # /chat first compile pulls heavy client bundles (plotly, markdown, canvas state).
    # 3 GiB still spikes in this workspace, so leave 4 GiB headroom for dev stability.
    mem_limit: 4096m
    mem_reservation: 1536m
    user: "${UID:-1000}:${GID:-1000}"         # corre como tu usuario, no root
    build:
      target: dev
    command:
      - /bin/sh
      - -c
      - |
        # Ensure .next directory has correct permissions
        mkdir -p /app/apps/web/.next
        # Install/update dependencies with bun
        echo "🟡 Installing dependencies with bun..."
        cd /app && bun install --frozen-lockfile
        # Start development server
        cd /app/apps/web && bun run dev --hostname 0.0.0.0 --port 3000
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - DEEP_RESEARCH_ENABLED=${DEEP_RESEARCH_ENABLED:-true}
      # Keep Next.js dev server persistent in local Docker sessions.
      - CI=false
    volumes:
      - ../bun.lock:/app/bun.lock:ro
      - ../package.json:/app/package.json:ro
      - ../packages:/app/packages
      - ../apps/web:/app/apps/web
      # Named volume to preserve container-installed dependencies
      # This overrides the bind mount for node_modules specifically
      - web_node_modules:/app/apps/web/node_modules
      # .next uses host directory directly (bind mount inherits host perms)

  backend:
    mem_limit: 512m
    mem_reservation: 256m
    user: "${UID:-1000}:${GID:-1000}"  # Run as host user for volume permissions
    build:
      target: development  # Use development stage with pytest and testing tools
    env_file:
      - ../envs/.env
    volumes:
      # Mount source code for hot reload
      - ../apps/backend/src:/app/src
      - ../apps/backend/tests:/app/tests:ro
      - ../apps/backend/pytest.ini:/app/pytest.ini:ro
      - ../apps/backend/.coveragerc:/app/.coveragerc:ro
    environment:
      - DEEP_RESEARCH_ENABLED=${DEEP_RESEARCH_ENABLED:-true}
      - TABLE_MODE_SEMANTIC_ENABLED=${TABLE_MODE_SEMANTIC_ENABLED:-false}
      - TABLE_MODE_SEMANTIC_THRESHOLD=${TABLE_MODE_SEMANTIC_THRESHOLD:-0.62}
      - TABLE_MODE_SEMANTIC_MIN_MARGIN=${TABLE_MODE_SEMANTIC_MIN_MARGIN:-0.05}
      - DATA_MODEL_ROUTING_ENABLED=${DATA_MODEL_ROUTING_ENABLED:-false}
      - PYTHONPATH=/usr/local/lib/python3.11/site-packages:/app/src  # Ensure vendor MCP takes precedence
      - COVERAGE_FILE=/tmp/.coverage

  file-manager:
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      # Mount source code for hot reload
      - ../plugins/public/file-manager/src:/app/src

  # Aletheia - Deep Research development configuration
  aletheia:
    build:
      target: development
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for hot reload
      - ../plugins/private/aletheia/domain:/app/domain
      - ../plugins/private/aletheia/adapters:/app/adapters
      - ../plugins/private/aletheia/apps:/app/apps
      - ../plugins/private/aletheia/ports:/app/ports

  mongodb:
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    mem_limit: 128m
    mem_reservation: 64m

  minio:
    mem_limit: 256m
    mem_reservation: 128m

  embedding-service:
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  web_node_modules:
    driver: local
