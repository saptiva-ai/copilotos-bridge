name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to build (comma-separated or "all")'
        required: false
        default: 'auto'
      deploy:
        description: 'Deploy to production after build'
        type: boolean
        default: false
      no_cache:
        description: 'Build without Docker cache (recommended for bug fixes)'
        type: boolean
        default: false
      run_smoke_tests:
        description: 'Run smoke tests after deploy'
        type: boolean
        default: true
      deploy_targets:
        description: 'Deploy targets (comma-separated: demo,invex or "all")'
        required: false
        default: 'all'
        type: string
      rollback_version:
        description: 'Rollback to specific version (e.g., 1.4.6) - triggers rollback instead of deploy'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # STAGE 1: DETECT CHANGES
  # ===========================================================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      bank-advisor: ${{ steps.filter.outputs.bank-advisor }}
      file-manager: ${{ steps.filter.outputs.file-manager }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      services: ${{ steps.matrix.outputs.services }}
      services_csv: ${{ steps.matrix.outputs.services_csv }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}
      dashboard_version: ${{ steps.version.outputs.dashboard_version }}
      is_release: ${{ steps.context.outputs.is_release }}
      should_deploy: ${{ steps.context.outputs.should_deploy }}
      deploy_targets: ${{ steps.deploy-targets.outputs.deploy_targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            bank-advisor:
              - 'plugins/bank-advisor-private/**'
            file-manager:
              - 'plugins/public/file-manager/**'
            dashboard:
              - 'apps/dashboard/**'

      - name: Build service matrix
        id: matrix
        run: |
          # Manual override
          if [[ "${{ github.event.inputs.services }}" == "all" ]]; then
            echo 'services=["backend","web","bank-advisor","file-manager","dashboard"]' >> $GITHUB_OUTPUT
            echo "services_csv=backend,web,bank-advisor,file-manager,dashboard" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          elif [[ "${{ github.event.inputs.services }}" != "auto" && -n "${{ github.event.inputs.services }}" ]]; then
            SERVICES="${{ github.event.inputs.services }}"
            echo "services=[\"${SERVICES//,/\",\"}\"]" >> $GITHUB_OUTPUT
            echo "services_csv=$SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Auto-detect from paths
          SERVICES=()

          [[ "${{ steps.filter.outputs.backend }}" == "true" ]] && SERVICES+=("backend")
          [[ "${{ steps.filter.outputs.web }}" == "true" ]] && SERVICES+=("web")
          [[ "${{ steps.filter.outputs.bank-advisor }}" == "true" ]] && SERVICES+=("bank-advisor")
          [[ "${{ steps.filter.outputs.file-manager }}" == "true" ]] && SERVICES+=("file-manager")
          [[ "${{ steps.filter.outputs.dashboard }}" == "true" ]] && SERVICES+=("dashboard")

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "services_csv=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            CSV=$(IFS=,; echo "${SERVICES[*]}")
            echo "services=$JSON" >> $GITHUB_OUTPUT
            echo "services_csv=$CSV" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Read current version from compose images file (source of truth)
            LATEST=$(grep -oP 'octavios-invex-backend:\K[0-9]+\.[0-9]+\.[0-9]+' infra/docker-compose.images.yml 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then
              LATEST="0.0.0"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Dashboard has an independent version track (1.0.x)
          DASH_LATEST=$(grep -oP 'octavios-invex-dashboard:\K[0-9]+\.[0-9]+\.[0-9]+' infra/docker-compose.images.yml 2>/dev/null | head -1)
          if [ -z "$DASH_LATEST" ]; then
            DASH_LATEST="1.0.0"
          fi
          IFS='.' read -r D_MAJ D_MIN D_PAT <<< "$DASH_LATEST"
          echo "dashboard_version=${D_MAJ}.${D_MIN}.$((D_PAT + 1))" >> $GITHUB_OUTPUT

      - name: Determine context
        id: context
        run: |
          IS_RELEASE=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "true" || echo "false")
          SHOULD_DEPLOY=$([[ "${{ github.event.inputs.deploy }}" == "true" || "$IS_RELEASE" == "true" || "$GITHUB_REF" == "refs/heads/main" ]] && echo "true" || echo "false")
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

      - name: Resolve deploy targets
        id: deploy-targets
        run: |
          INPUT="${{ github.event.inputs.deploy_targets }}"
          if [[ "$INPUT" == "all" || -z "$INPUT" ]]; then
            echo 'deploy_targets=["demo","invex"]' >> $GITHUB_OUTPUT
          else
            TARGETS=$(echo "$INPUT" | jq -R 'split(",") | map(ltrimstr(" ") | rtrimstr(" "))')
            echo "deploy_targets=$TARGETS" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## 🔍 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| backend | ${{ steps.filter.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ steps.filter.outputs.web }} |" >> $GITHUB_STEP_SUMMARY
          echo "| bank-advisor | ${{ steps.filter.outputs.bank-advisor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| file-manager | ${{ steps.filter.outputs.file-manager }} |" >> $GITHUB_STEP_SUMMARY
          echo "| dashboard | ${{ steps.filter.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** ${{ steps.matrix.outputs.services_csv || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard version:** ${{ steps.version.outputs.dashboard_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Will deploy:** ${{ steps.context.outputs.should_deploy }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy targets:** ${{ steps.deploy-targets.outputs.deploy_targets }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 2: SECURITY SCAN
  # ===========================================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
        continue-on-error: true

  # ===========================================================================
  # STAGE 3: BUILD & PUSH (Only on main, tags, or manual)
  # ===========================================================================
  build:
    name: 🐳 Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, security]
    if: |
      always() &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped' || needs.security.result == 'failure')

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve service version
        id: svc-version
        run: |
          if [ "${{ matrix.service }}" = "dashboard" ]; then
            echo "version=${{ needs.detect-changes.outputs.dashboard_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.detect-changes.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          ARGS="-v ${{ steps.svc-version.outputs.version }} -s ${{ matrix.service }}"
          ARGS="$ARGS --cache-from type=gha,scope=${{ matrix.service }}"
          ARGS="$ARGS --cache-to type=gha,mode=max,scope=${{ matrix.service }}"
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            ARGS="$ARGS --no-cache"
          fi
          ./scripts/deploy/build.sh $ARGS

      - name: Push image
        run: |
          ./scripts/deploy/push.sh -v ${{ steps.svc-version.outputs.version }} -s ${{ matrix.service }}

      - name: Summary
        run: |
          echo "## 🐳 Built: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.svc-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: saptivaai/octavios-invex-${{ matrix.service }}:${{ steps.svc-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- No-cache: ${{ github.event.inputs.no_cache || 'false' }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 5: UPDATE COMPOSE FILE
  # ===========================================================================
  update-compose:
    name: 📝 Update Compose
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PUSH_MAIN }}

      - name: Update versions
        run: |
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          VERSION="${{ needs.detect-changes.outputs.version }}"
          DASHBOARD_VERSION="${{ needs.detect-changes.outputs.dashboard_version }}"

          for service in $(echo $SERVICES | jq -r '.[]'); do
            if [ "$service" = "dashboard" ]; then
              ./scripts/deploy/update-images.sh -v "$DASHBOARD_VERSION" -s "$service"
            else
              ./scripts/deploy/update-images.sh -v "$VERSION" -s "$service"
            fi
          done

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.PAT_PUSH_MAIN }}
        run: |
          VERSION="${{ needs.detect-changes.outputs.version }}"
          SERVICES_CSV="${{ needs.detect-changes.outputs.services_csv }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet infra/docker-compose.images.yml; then
            echo "No changes to commit"
            exit 0
          fi

          git add infra/docker-compose.images.yml

          # Try direct push first (works if PAT has bypass permissions)
          git commit -m "chore(images): update to v${VERSION} [${SERVICES_CSV}]"
          if git push 2>/dev/null; then
            echo "✅ Direct push to main succeeded"
            exit 0
          fi

          echo "⚠️ Direct push blocked by branch protection, creating PR..."

          # Fallback: create a PR
          BRANCH="chore/images-v${VERSION}"

          # Clean up any existing branch/PR from a previous run
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            gh pr close "$EXISTING_PR" --delete-branch 2>/dev/null || true
            echo "Closed stale PR #${EXISTING_PR}"
          fi
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(images): update to v${VERSION} [${SERVICES_CSV}]" \
            --body "Auto-generated by CI after successful build and deploy of v${VERSION}."

          echo "✅ PR created for compose version bump"

  # ===========================================================================
  # STAGE 6: MONGODB BACKUP (Pre-Deploy Safety)
  # ===========================================================================
  backup:
    name: "💾 Backup (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: [detect-changes, build, update-compose]
    if: |
      always() &&
      needs.detect-changes.outputs.should_deploy == 'true' &&
      needs.build.result == 'success' &&
      (needs.update-compose.result == 'success' || needs.update-compose.result == 'skipped' || needs.update-compose.result == 'failure')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.deploy_targets) }}
    environment: prod-${{ matrix.target }}

    steps:
      - name: Create MongoDB backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            BACKUP_NAME="mongodb-backup-pre-v${{ needs.detect-changes.outputs.version }}-$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="backups"

            echo "💾 Creating MongoDB backup: $BACKUP_NAME"
            mkdir -p "$BACKUP_DIR"

            # Dump MongoDB data
            docker compose -f infra/docker-compose.yml exec -T mongodb mongodump \
              --archive=/tmp/$BACKUP_NAME.archive \
              --gzip || echo "⚠️ mongodump command failed"

            # Copy backup out of container
            docker compose -f infra/docker-compose.yml cp \
              mongodb:/tmp/$BACKUP_NAME.archive \
              "$BACKUP_DIR/$BACKUP_NAME.archive" || echo "⚠️ Backup copy failed"

            # Verify backup file exists and is non-empty
            if [ -f "$BACKUP_DIR/$BACKUP_NAME.archive" ] && [ -s "$BACKUP_DIR/$BACKUP_NAME.archive" ]; then
              echo "✅ Backup verified: $(du -h "$BACKUP_DIR/$BACKUP_NAME.archive" | cut -f1)"
            else
              echo "❌ Backup file missing or empty — deploy will proceed but recovery is not possible"
              exit 1
            fi

            # Cleanup old backups (keep last 5)
            cd "$BACKUP_DIR"
            ls -t mongodb-backup-* 2>/dev/null | tail -n +6 | xargs -r rm -f

            echo "✅ Backup completed: $BACKUP_DIR/$BACKUP_NAME.archive"

      - name: Summary
        run: |
          echo "## 💾 MongoDB Backup" >> $GITHUB_STEP_SUMMARY
          echo "Backup created before v${{ needs.detect-changes.outputs.version }} deploy" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 7: DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: "🚀 Deploy (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: [detect-changes, build, update-compose, backup]
    if: |
      always() &&
      needs.detect-changes.outputs.should_deploy == 'true' &&
      needs.build.result == 'success' &&
      (needs.update-compose.result == 'success' || needs.update-compose.result == 'skipped' || needs.update-compose.result == 'failure') &&
      (needs.backup.result == 'success' || needs.backup.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.deploy_targets) }}
    environment: prod-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            SERVICES='${{ needs.detect-changes.outputs.services }}'
            VERSION="${{ needs.detect-changes.outputs.version }}"
            DASHBOARD_VERSION="${{ needs.detect-changes.outputs.dashboard_version }}"
            COMPOSE_CMD="docker compose -f infra/docker-compose.yml -f infra/docker-compose.images.yml -f infra/docker-compose.production.yml --env-file envs/.env"

            echo "📥 Pulling latest code..."
            git checkout -- infra/docker-compose.images.yml 2>/dev/null || true
            git pull origin main

            # Update image tags in compose file on server (in case
            # Update Compose step couldn't push to main due to branch protection)
            echo "📝 Updating image tags..."
            for service in $(echo $SERVICES | jq -r '.[]'); do
              if [ "$service" = "dashboard" ]; then
                SVC_VERSION="$DASHBOARD_VERSION"
              else
                SVC_VERSION="$VERSION"
              fi
              sed -i "s|saptivaai/octavios-invex-${service}:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-${service}:${SVC_VERSION}|g" infra/docker-compose.images.yml
            done

            echo "🐳 Pulling new images..."
            for service in $(echo $SERVICES | jq -r '.[]'); do
              if [ "$service" = "dashboard" ]; then
                SVC_VERSION="$DASHBOARD_VERSION"
              else
                SVC_VERSION="$VERSION"
              fi
              docker pull saptivaai/octavios-invex-$service:$SVC_VERSION
            done

            # ============================================================
            # CRITICAL: Remove shared volume to prevent stale code
            # See: docs/manuals/deploy/README.md - Top Recurring Incidents
            # ============================================================
            if echo $SERVICES | jq -e 'contains(["backend"])' > /dev/null; then
              echo "🗑️ Removing stale backend_shared volume..."
              $COMPOSE_CMD stop backend bank-advisor 2>/dev/null || true
              $COMPOSE_CMD rm -sf backend bank-advisor 2>/dev/null || true
              docker volume rm octavios-chat-bajaware_invex_backend_shared 2>/dev/null || true
              echo "✅ Volume removed - fresh code will be used"
            fi

            # Build the list of services to start.
            # Always include bank-advisor when backend is deployed because
            # they share a volume and bank-advisor gets removed above.
            DEPLOY_SERVICES=$(echo $SERVICES | jq -r 'join(" ")')
            if echo $SERVICES | jq -e 'contains(["backend"])' > /dev/null; then
              if ! echo $SERVICES | jq -e 'contains(["bank-advisor"])' > /dev/null; then
                DEPLOY_SERVICES="$DEPLOY_SERVICES bank-advisor"
                echo "ℹ️ Adding bank-advisor to deploy (co-dependent with backend)"
              fi
            fi

            # Add --profile monitoring when dashboard is being deployed
            if echo $SERVICES | jq -e 'contains(["dashboard"])' > /dev/null; then
              COMPOSE_CMD="$COMPOSE_CMD --profile monitoring"
            fi

            echo "🔄 Starting services with force-recreate..."
            $COMPOSE_CMD up -d --force-recreate $DEPLOY_SERVICES

            echo "⏳ Waiting for containers to be ready..."
            sleep 10

            # ============================================================
            # Flush Redis cache to prevent stale data
            # ============================================================
            echo "🧹 Flushing Redis cache..."
            $COMPOSE_CMD exec -T backend python3 -c "
            import os
            import redis
            try:
                r = redis.from_url(os.environ.get('REDIS_URL'))
                r.flushdb()
                print('✅ Redis cache flushed successfully')
            except Exception as e:
                print(f'⚠️ Redis flush warning: {e}')
            " || echo "⚠️ Redis flush skipped (see error above)"

            echo "✅ Deploy script completed!"

      - name: Health Check - Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            echo "🏥 Running health checks..."

            # Wait for services to be healthy
            MAX_RETRIES=12
            RETRY_INTERVAL=5

            for i in $(seq 1 $MAX_RETRIES); do
              echo "Health check attempt $i/$MAX_RETRIES..."

              # Backend health
              BACKEND_HEALTH=$(curl -sf http://localhost:8000/api/health 2>/dev/null || echo '{"status":"unhealthy"}')
              BACKEND_STATUS=$(echo $BACKEND_HEALTH | jq -r '.status // "unknown"')

              if [ "$BACKEND_STATUS" = "healthy" ]; then
                echo "✅ Backend is healthy"
                echo "$BACKEND_HEALTH" | jq .
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ Backend health check failed after $MAX_RETRIES attempts"
                docker compose -f infra/docker-compose.yml logs backend --tail=50
                exit 1
              fi

              sleep $RETRY_INTERVAL
            done

      - name: Health Check - Bank Advisor
        if: contains(needs.detect-changes.outputs.services, 'bank-advisor') || contains(needs.detect-changes.outputs.services, 'backend')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}

            MAX_RETRIES=6
            RETRY_INTERVAL=5

            for i in $(seq 1 $MAX_RETRIES); do
              BA_HEALTH=$(curl -sf http://localhost:8002/health 2>/dev/null || echo '{"status":"unhealthy"}')
              BA_STATUS=$(echo $BA_HEALTH | jq -r '.status // "unknown"')

              if [ "$BA_STATUS" = "healthy" ]; then
                echo "✅ Bank-Advisor is healthy"
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ Bank-Advisor health check failed after $MAX_RETRIES attempts"
                docker compose -f infra/docker-compose.yml logs bank-advisor --tail=50
                exit 1
              fi

              sleep $RETRY_INTERVAL
            done

      - name: Health Check - File Manager
        if: contains(needs.detect-changes.outputs.services, 'file-manager')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}

            MAX_RETRIES=6
            RETRY_INTERVAL=5

            for i in $(seq 1 $MAX_RETRIES); do
              FM_HEALTH=$(curl -sf http://localhost:8001/health 2>/dev/null || echo '{"status":"unhealthy"}')
              FM_STATUS=$(echo $FM_HEALTH | jq -r '.status // "unknown"')

              if [ "$FM_STATUS" = "healthy" ]; then
                echo "✅ File-Manager is healthy"
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ File-Manager health check failed after $MAX_RETRIES attempts"
                docker compose -f infra/docker-compose.yml logs file-manager --tail=50
                exit 1
              fi

              sleep $RETRY_INTERVAL
            done

      - name: Health Check - Dashboard
        if: contains(needs.detect-changes.outputs.services, 'dashboard')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}

            MAX_RETRIES=6
            RETRY_INTERVAL=5

            for i in $(seq 1 $MAX_RETRIES); do
              DASH_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8050/ 2>/dev/null || echo "000")

              if [ "$DASH_STATUS" = "200" ] || [ "$DASH_STATUS" = "302" ]; then
                echo "✅ Dashboard is responding (HTTP $DASH_STATUS)"
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "⚠️ Dashboard health check timed out (non-blocking)"
                break
              fi

              sleep $RETRY_INTERVAL
            done

      - name: Health Check - Web
        if: contains(needs.detect-changes.outputs.services, 'web')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}

            MAX_RETRIES=6
            RETRY_INTERVAL=5

            for i in $(seq 1 $MAX_RETRIES); do
              WEB_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")

              if [ "$WEB_STATUS" = "200" ]; then
                echo "✅ Web frontend is responding (HTTP 200)"
                break
              fi

              if [ $i -eq $MAX_RETRIES ]; then
                echo "⚠️ Web health check timed out (non-blocking)"
                break
              fi

              sleep $RETRY_INTERVAL
            done

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}
            echo "📋 Final deployment status:"
            docker compose -f infra/docker-compose.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

      - name: Cleanup Old Images
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "🧹 Cleaning up old Docker images..."
            echo "Before cleanup:"
            docker system df --format "table {{.Type}}\t{{.TotalCount}}\t{{.Size}}\t{{.Reclaimable}}"
            docker image prune -af || echo "⚠️ Image prune failed (non-blocking)"
            echo ""
            echo "After cleanup:"
            docker system df --format "table {{.Type}}\t{{.TotalCount}}\t{{.Size}}\t{{.Reclaimable}}"
            echo "✅ Image cleanup completed"

      - name: Summary
        run: |
          echo "## 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** ${{ needs.detect-changes.outputs.services_csv }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] MongoDB backup created" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Stale volumes removed (if backend deployed)" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Services deployed with force-recreate" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Redis cache flushed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Health checks passed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # STAGE 8: SMOKE TESTS (Post-Deploy Validation)
  # ===========================================================================
  smoke-tests:
    name: "🔥 Smoke Tests (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      github.event.inputs.run_smoke_tests != 'false'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.deploy_targets) }}
    environment: prod-${{ matrix.target }}

    steps:
      - name: Run Smoke Tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            echo "🔥 Running smoke tests..."
            PASSED=0
            FAILED=0

            # ============================================================
            # Test 1: Backend API Health
            # ============================================================
            echo "Test 1: Backend API Health..."
            HEALTH=$(curl -sf http://localhost:8000/api/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | jq -e '.status == "healthy"' > /dev/null 2>&1; then
              echo "  ✅ Backend healthy"
              ((++PASSED))
            else
              echo "  ❌ Backend unhealthy"
              ((++FAILED))
            fi

            # ============================================================
            # Test 2: Bank Advisor Health
            # ============================================================
            echo "Test 2: Bank Advisor Health..."
            BA_HEALTH=$(curl -sf http://localhost:8002/health 2>/dev/null || echo '{}')
            if echo "$BA_HEALTH" | jq -e '.status == "healthy"' > /dev/null 2>&1; then
              echo "  ✅ Bank Advisor healthy"
              ((++PASSED))
            else
              echo "  ❌ Bank Advisor not responding"
              ((++FAILED))
            fi

            # ============================================================
            # Test 3: File Manager Health
            # ============================================================
            echo "Test 3: File Manager Health..."
            FM_HEALTH=$(curl -sf http://localhost:8001/health 2>/dev/null || echo '{}')
            if echo "$FM_HEALTH" | jq -e '.status == "healthy"' > /dev/null 2>&1; then
              echo "  ✅ File Manager healthy"
              ((++PASSED))
            else
              echo "  ⚠️ File Manager not responding (non-blocking)"
              ((++PASSED))  # Non-blocking
            fi

            # ============================================================
            # Test 4: Web Frontend
            # ============================================================
            echo "Test 4: Web Frontend..."
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            if [ "$WEB_STATUS" = "200" ] || [ "$WEB_STATUS" = "307" ]; then
              echo "  ✅ Web frontend responding (HTTP $WEB_STATUS)"
              ((++PASSED))
            else
              echo "  ❌ Web frontend not responding (HTTP $WEB_STATUS)"
              ((++FAILED))
            fi

            # ============================================================
            # Test 5: Dashboard
            # ============================================================
            echo "Test 5: Dashboard..."
            DASH_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8050/ 2>/dev/null || echo "000")
            if [ "$DASH_STATUS" = "200" ] || [ "$DASH_STATUS" = "302" ]; then
              echo "  ✅ Dashboard responding (HTTP $DASH_STATUS)"
              ((++PASSED))
            else
              echo "  ⚠️ Dashboard not responding (non-blocking)"
              ((++PASSED))  # Non-blocking - monitoring service
            fi

            # ============================================================
            # Test 6: Database Connectivity
            # ============================================================
            echo "Test 6: Database Connectivity..."
            DB_CHECK=$(curl -sf http://localhost:8000/api/health 2>/dev/null | jq -r '.checks.database.status // "unknown"')
            if [ "$DB_CHECK" = "healthy" ]; then
              echo "  ✅ Database connected"
              ((++PASSED))
            else
              echo "  ❌ Database connection issue"
              ((++FAILED))
            fi

            # ============================================================
            # Test 7: Basic Query Test (NL2SQL)
            # ============================================================
            echo "Test 7: Basic Query Capability..."
            # Just verify the chat endpoint responds (don't actually run a query)
            CHAT_CHECK=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/api/chat/health 2>/dev/null || \
                         curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/api/health 2>/dev/null || echo "000")
            if [ "$CHAT_CHECK" = "200" ]; then
              echo "  ✅ Chat API accessible"
              ((++PASSED))
            else
              echo "  ⚠️ Chat API check skipped"
              ((++PASSED))  # Non-blocking
            fi

            # ============================================================
            # Test 8: Verify tenant profile
            # ============================================================
            echo "Test 8: Tenant Identity..."
            EXPECTED_PROFILE="${{ vars.DEPLOYMENT_PROFILE }}"
            BACKEND_CONTAINER=$(docker ps --filter "name=-backend" --format '{{.Names}}' | grep -E "backend$" | head -1)
            echo "  Container: ${BACKEND_CONTAINER:-<not found>}"
            if [ -z "$BACKEND_CONTAINER" ]; then
              echo "  ⚠️ Backend container not found — cannot verify profile"
              ((++FAILED))
            elif [ -n "$EXPECTED_PROFILE" ]; then
              ACTUAL_PROFILE=$(docker exec "$BACKEND_CONTAINER" printenv BANKADVISOR_PROFILE 2>/dev/null || echo "not-set")
              if [ "$ACTUAL_PROFILE" = "$EXPECTED_PROFILE" ]; then
                echo "  ✅ BANKADVISOR_PROFILE=$ACTUAL_PROFILE"
                ((++PASSED))
              else
                echo "  ❌ BANKADVISOR_PROFILE=$ACTUAL_PROFILE (expected $EXPECTED_PROFILE)"
                echo "  ℹ️  Fix: update BANKADVISOR_PROFILE in envs/.env on this server"
                ((++FAILED))
              fi
            else
              echo "  ⏭️ SKIP: DEPLOYMENT_PROFILE var not set in GitHub environment"
              ((++PASSED))
            fi

            # ============================================================
            # Summary
            # ============================================================
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Smoke Test Results: $PASSED passed, $FAILED failed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ $FAILED -gt 0 ]; then
              echo "⚠️ Some smoke tests failed - review recommended"
              exit 1
            else
              echo "✅ All smoke tests passed!"
            fi

      - name: Summary
        if: always()
        run: |
          echo "## 🔥 Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Post-deploy validation completed for v${{ needs.detect-changes.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # STAGE 9: ROLLBACK (Manual Trigger Only)
  # ===========================================================================
  rollback:
    name: "⏪ Rollback (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rollback_version != ''
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-changes.outputs.deploy_targets) }}
    environment: prod-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Rollback Version
        id: validate
        run: |
          VERSION="${{ github.event.inputs.rollback_version }}"
          echo "Validating rollback to version: $VERSION"

          # Basic version format check
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format. Expected: X.Y.Z (e.g., 1.4.6)"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version format valid: $VERSION"

      - name: Create Pre-Rollback Backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            BACKUP_NAME="mongodb-backup-pre-rollback-$(date +%Y%m%d-%H%M%S)"
            mkdir -p backups

            echo "💾 Creating pre-rollback backup: $BACKUP_NAME"
            docker compose -f infra/docker-compose.yml exec -T mongodb mongodump \
              --archive=/tmp/$BACKUP_NAME.archive --gzip || echo "⚠️ mongodump command failed"

            docker compose -f infra/docker-compose.yml cp \
              mongodb:/tmp/$BACKUP_NAME.archive \
              backups/$BACKUP_NAME.archive || echo "⚠️ Backup copy failed"

            if [ -f "backups/$BACKUP_NAME.archive" ] && [ -s "backups/$BACKUP_NAME.archive" ]; then
              echo "✅ Pre-rollback backup verified: $(du -h "backups/$BACKUP_NAME.archive" | cut -f1)"
            else
              echo "⚠️ Pre-rollback backup failed — rollback will proceed without recovery point"
            fi

      - name: Execute Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}

            VERSION="${{ github.event.inputs.rollback_version }}"
            COMPOSE_CMD="docker compose -f infra/docker-compose.yml -f infra/docker-compose.images.yml -f infra/docker-compose.production.yml --env-file envs/.env"

            echo "⏪ Rolling back to version $VERSION..."

            # Pull the rollback version images
            echo "🐳 Pulling images for v$VERSION..."
            PULL_FAILED=0
            for img in backend web bank-advisor file-manager dashboard; do
              if ! docker pull saptivaai/octavios-invex-$img:$VERSION; then
                echo "⚠️ $img:$VERSION not found"
                PULL_FAILED=$((PULL_FAILED + 1))
              fi
            done

            if [ $PULL_FAILED -gt 0 ]; then
              echo "❌ $PULL_FAILED images failed to pull — aborting rollback"
              exit 1
            fi

            # Update docker-compose.images.yml to use rollback version
            echo "📝 Updating compose file to v$VERSION..."
            sed -i "s|saptivaai/octavios-invex-backend:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-backend:$VERSION|g" infra/docker-compose.images.yml
            sed -i "s|saptivaai/octavios-invex-web:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-web:$VERSION|g" infra/docker-compose.images.yml
            sed -i "s|saptivaai/octavios-invex-bank-advisor:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-bank-advisor:$VERSION|g" infra/docker-compose.images.yml
            sed -i "s|saptivaai/octavios-invex-file-manager:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-file-manager:$VERSION|g" infra/docker-compose.images.yml
            sed -i "s|saptivaai/octavios-invex-dashboard:[0-9]\+\.[0-9]\+\.[0-9]\+|saptivaai/octavios-invex-dashboard:$VERSION|g" infra/docker-compose.images.yml

            # Stop and remove containers + volumes
            echo "🗑️ Removing current deployment..."
            $COMPOSE_CMD --profile monitoring stop backend bank-advisor web file-manager dashboard 2>/dev/null || true
            $COMPOSE_CMD --profile monitoring rm -sf backend bank-advisor web file-manager dashboard 2>/dev/null || true
            docker volume rm octavios-chat-bajaware_invex_backend_shared 2>/dev/null || true

            # Start with rollback version
            echo "🔄 Starting services with v$VERSION..."
            $COMPOSE_CMD --profile monitoring up -d --force-recreate backend bank-advisor web file-manager dashboard

            # Wait and verify
            echo "⏳ Waiting for services..."
            sleep 15

            # Flush Redis
            echo "🧹 Flushing Redis cache..."
            $COMPOSE_CMD exec -T backend python3 -c "
            import os, redis
            try:
                r = redis.from_url(os.environ.get('REDIS_URL'))
                r.flushdb()
                print('✅ Redis flushed')
            except Exception as e:
                print(f'⚠️ Redis flush warning: {e}')
            " || echo "⚠️ Redis flush skipped (see error above)"

            echo "✅ Rollback to v$VERSION completed!"

      - name: Verify Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ secrets.PROD_PATH }}

            echo "🏥 Verifying rollback..."
            MAX_RETRIES=6

            for i in $(seq 1 $MAX_RETRIES); do
              HEALTH=$(curl -sf http://localhost:8000/api/health 2>/dev/null || echo '{}')
              STATUS=$(echo $HEALTH | jq -r '.status // "unknown"')

              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Backend is healthy after rollback"
                docker compose -f infra/docker-compose.yml ps
                exit 0
              fi

              echo "Attempt $i/$MAX_RETRIES - waiting..."
              sleep 5
            done

            echo "❌ Health check timed out after rollback"
            docker compose -f infra/docker-compose.yml ps
            docker compose -f infra/docker-compose.yml logs backend --tail=30
            exit 1

      - name: Summary
        run: |
          echo "## ⏪ Rollback Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rolled back to:** v${{ github.event.inputs.rollback_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Steps Completed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Pre-rollback MongoDB backup created" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Previous version images pulled" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Compose file updated" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Services restarted with rollback version" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Redis cache flushed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Health verification completed" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # SKIP NOTIFICATION
  # ===========================================================================
  no-changes:
    name: ℹ️ No Changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'false'

    steps:
      - run: |
          echo "## ℹ️ No Service Changes" >> $GITHUB_STEP_SUMMARY
          echo "No services were affected. Build skipped." >> $GITHUB_STEP_SUMMARY
