name: CI (Manual Deploy)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Backend Tests
  # ============================================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch to save disk space (avoids ~2GB+ CUDA libs)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx safety mongomock_motor

      - name: Security audit with Safety
        run: |
          safety check --ignore 64459 --ignore 64396
        continue-on-error: true

      - name: Run unit tests
        env:
          TEST_MODE: "true"
        run: |
          pytest -q --cov=src --cov-report=xml --cov-report=term \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --ignore=tests/debug \
            --ignore=tests/manual \
            --ignore=tests/unit \
            --ignore=tests/test_auth_email_normalization.py \
            --ignore=tests/test_intent.py \
            --ignore=tests/test_messages_images.py \
            --ignore=tests_legacy

      - name: Upload coverage (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: apps/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================================
  # Frontend Tests
  # ============================================================================
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure frontend environment
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:8000" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_ENABLE_MSW=false" >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run bun:typecheck:web

      - name: Lint
        run: bun run bun:lint:web

      - name: Run tests
        run: bun run bun:test:web

      - name: Upload coverage (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          directory: apps/web/coverage
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================================
  # Security Scan (Optional)
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ============================================================================
  # Build Check (No Deploy)
  # ============================================================================
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build status summary
        run: |
          echo "✅ All tests passed"
          echo ""
          echo "📦 Ready for manual deployment"
          echo ""
          echo "To deploy, run:"
          echo "  ./scripts/deploy.sh tar --force"
          echo ""
          echo "Or use workflow_dispatch for automated deploy"
